<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalogue — Bijoux et accessoires</title>
<style>
:root {
  --bg: #0a0a0a;
  --card: #171717;
  --line: #262626;
  --txt: #fff;
  --sub: #a3a3a3;
  --mute: #737373;
  --tab: #171717;
  --tabOn: #fff;
  --tabOnTxt: #171717;
}

[data-theme="light"] {
  --bg: #fff;
  --card: #fff;
  --line: #e5e5e5;
  --txt: #171717;
  --sub: #737373;
  --mute: #a3a3a3;
  --tab: #f5f5f5;
  --tabOn: #171717;
  --tabOnTxt: #fff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive;
  background: var(--bg);
  color: var(--txt);
  transition: background 0.2s, color 0.2s;
}

.wrap {
  max-width: 1152px;
  margin: 0 auto;
  padding: 0 20px;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}

header .wrap {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 16px;
  padding-bottom: 16px;
}

h1 {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.theme {
  border: 0;
  border-radius: 10px;
  padding: 8px 10px;
  background: var(--tab);
  color: var(--txt);
  cursor: pointer;
  font-size: 16px;
}

.hero {
  padding-top: 48px;
  padding-bottom: 24px;
}

.hero h2 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.hero p {
  color: var(--sub);
  font-size: 15px;
}

nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 24px;
}

nav button {
  flex-shrink: 0;
  border: 0;
  border-radius: 10px;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 500;
  background: var(--tab);
  color: var(--sub);
  cursor: pointer;
}

nav button.on {
  background: var(--tabOn);
  color: var(--tabOnTxt);
}

.grid {
  display: grid;
  gap: 20px;
  grid-template-columns: repeat(2, 1fr);
  padding-bottom: 64px;
}

@media (min-width: 768px) {
  .grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (min-width: 1024px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.cat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

.cat-card:hover {
  border-color: var(--txt);
  transform: translateY(-4px);
}

.cat-card h3 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
}

.cat-card p {
  font-size: 13px;
  color: var(--sub);
}

.msg {
  grid-column: 1 / -1;
  text-align: center;
  padding: 48px 20px;
  color: var(--mute);
  font-size: 14px;
}

footer {
  border-top: 1px solid var(--line);
  padding: 24px 0 calc(24px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  font-size: 13px;
  color: var(--mute);
}
</style>
</head>
<body>
<header><div class="wrap"><h1>Catalogue</h1><button class="theme" id="theme" aria-label="Changer de thème">☀️</button></div></header>
<section class="wrap hero"><h2>Bijoux et accessoires</h2><p>Sélectionnez une catégorie pour explorer</p></section>
<nav class="wrap" id="tabs"></nav>
<main class="wrap"><div id="grid" class="grid"></div></main>
<footer>© 2026 Shop — tous droits réservés</footer>

<script>
const CATEGORIES = [
  { id: "colliers", name: "Colliers", count: 0 },
  { id: "bracelets", name: "Bracelets", count: 0 },
  { id: "bagues", name: "Bagues", count: 0 }
];

document.addEventListener("DOMContentLoaded", () => {
  initTheme();
  renderCatalog();
  document.getElementById("theme").addEventListener("click", toggleTheme);
});

function initTheme() {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  document.getElementById("theme").textContent = isLight ? "🌙" : "☀️";
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute("data-theme");
  const nextTheme = currentTheme === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", nextTheme);
  document.getElementById("theme").textContent = nextTheme === "light" ? "🌙" : "☀️";
}

function renderCatalog() {
  const gridContainer = document.getElementById("grid");
  gridContainer.innerHTML = CATEGORIES.map(cat => `
    <article class="cat-card" onclick="selectCategory('${cat.id}')">
      <h3>${cat.name}</h3>
      <p>${cat.count} articles</p>
    </article>
  `).join("") + `
    <div class="msg">Sélectionnez une catégorie pour voir les produits disponibles</div>
  `;
}

function selectCategory(catId) {
  const cat = CATEGORIES.find(c => c.id === catId);
  console.log("Catégorie sélectionnée:", cat.name);
}
</script>
</body>
</html>
